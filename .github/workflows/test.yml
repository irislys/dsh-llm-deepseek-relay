name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The workspace pins same-day 0.1.2-alpha.* releases, which pnpm's
      # default supply-chain minimumReleaseAge policy (active on CI) would
      # reject both on install and on the implicit deps check before `pnpm test`.
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: Run test suite
        run: pnpm test