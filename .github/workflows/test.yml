name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # minimumReleaseAge=0: the workspace pins same-day 0.1.2-alpha.* releases,
        # which the default pnpm supply-chain age policy would reject.
        run: pnpm install --config.minimumReleaseAge=0
      - name: Run test suite
        run: pnpm test